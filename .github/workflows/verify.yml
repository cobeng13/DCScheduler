name: Verify scheduler
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: scheduler_tests
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U scheduler -d scheduler_tests" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://scheduler:test-only-password@localhost:5432/scheduler_tests
      - run: for script in deploy/*.sh; do bash -n "$script" || exit; done
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: docker build -t camp-scheduler:test .
